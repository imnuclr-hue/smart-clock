<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pi Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&family=Exo+2:wght@200;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0a0e14;
    --panel:     #0f1520;
    --border:    #1a2535;
    --accent:    #00d4ff;
    --accent2:   #ff6b35;
    --accent3:   #39ff6e;
    --text:      #cdd9e8;
    --dim:       #4a6080;
    --glow:      rgba(0, 212, 255, 0.15);
    --glow2:     rgba(0, 212, 255, 0.04);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Exo 2', sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* Subtle scanline overlay */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.07) 2px,
      rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  .layout {
    display: grid;
    grid-template-rows: 1fr auto auto;
    height: 100vh;
    padding: 16px;
    gap: 12px;
  }

  /* ── CLOCK ── */
  .clock-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .clock-panel::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 30%, var(--glow), transparent 70%);
    pointer-events: none;
  }

  .date-line {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 300;
    font-size: clamp(0.9rem, 2.5vw, 1.3rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 4px;
  }

  .time-display {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(4rem, 16vw, 10rem);
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 30px rgba(0,212,255,0.5), 0 0 60px rgba(0,212,255,0.2);
    letter-spacing: -0.02em;
    transition: text-shadow 0.3s;
  }

  .time-display .colon {
    animation: blink 1s step-end infinite;
    display: inline-block;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.2; }
  }

  .seconds-bar-wrap {
    width: 60%;
    max-width: 400px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 12px;
    overflow: hidden;
  }
  .seconds-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 1s linear;
    box-shadow: 0 0 8px rgba(0,212,255,0.6);
  }

  /* Toggle 24h button */
  .format-toggle {
    position: absolute;
    top: 12px;
    right: 14px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .format-toggle:active,
  .format-toggle.active {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--glow2);
    box-shadow: 0 0 10px var(--glow);
  }

  /* ── SENSOR + WEATHER ROW ── */
  .bottom-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    position: relative;
    overflow: hidden;
  }

  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: 10px 10px 0 0;
  }
  .panel.sensor-panel::before { background: linear-gradient(90deg, var(--accent3), transparent); }
  .panel.weather-panel::before { background: linear-gradient(90deg, var(--accent2), transparent); }

  .panel-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 10px;
  }

  /* Sensor grid */
  .sensor-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }

  .sensor-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .sensor-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(1.2rem, 3.5vw, 1.9rem);
    line-height: 1;
    color: var(--accent3);
    text-shadow: 0 0 12px rgba(57,255,110,0.4);
  }

  .sensor-unit {
    font-size: 0.6rem;
    color: var(--dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .sensor-label {
    font-size: 0.55rem;
    color: var(--dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .sensor-error {
    font-size: 0.7rem;
    color: var(--accent2);
    opacity: 0.7;
  }

  /* Light bar */
  .light-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .light-label {
    font-size: 0.6rem;
    color: var(--dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .light-bar-track {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .light-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff6b35, #ffe135);
    border-radius: 2px;
    transition: width 0.8s ease;
  }
  .light-lux {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: var(--accent2);
    white-space: nowrap;
    min-width: 54px;
    text-align: right;
  }

  /* ── WEATHER ── */
  .weather-offline {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--dim);
    font-size: 0.75rem;
    text-align: center;
    padding: 8px;
    letter-spacing: 0.06em;
    flex-direction: column;
    gap: 4px;
  }
  .offline-icon { font-size: 1.4rem; opacity: 0.4; }

  .weather-current {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .weather-icon { font-size: clamp(1.5rem, 4vw, 2.2rem); }
  .weather-temp {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(1.4rem, 4vw, 2rem);
    color: var(--accent2);
    text-shadow: 0 0 12px rgba(255,107,53,0.4);
  }
  .weather-desc {
    font-size: 0.7rem;
    color: var(--dim);
    letter-spacing: 0.06em;
  }
  .weather-wind {
    font-size: 0.6rem;
    color: var(--dim);
    margin-top: 2px;
  }

  .forecast-strip {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    border-top: 1px solid var(--border);
    padding-top: 8px;
  }

  .forecast-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }
  .fc-day-label {
    font-size: 0.55rem;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .fc-icon { font-size: 0.95rem; line-height: 1.3; }
  .fc-temps {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.55rem;
    color: var(--text);
    text-align: center;
  }
  .fc-temps span { color: var(--dim); }

  /* ── STATUS BAR ── */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 4px;
    height: 20px;
  }
  .status-item {
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.12em;
    color: var(--dim);
    text-transform: uppercase;
  }
  .dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--dim);
    margin-right: 5px;
    vertical-align: middle;
  }
  .dot.green  { background: var(--accent3); box-shadow: 0 0 4px var(--accent3); }
  .dot.orange { background: var(--accent2); box-shadow: 0 0 4px var(--accent2); }
  .dot.blue   { background: var(--accent);  box-shadow: 0 0 4px var(--accent); }

  /* ── FADE IN ── */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .clock-panel { animation: fadeIn 0.6s ease 0s both; }
  .sensor-panel { animation: fadeIn 0.6s ease 0.1s both; }
  .weather-panel { animation: fadeIn 0.6s ease 0.2s both; }
</style>
</head>
<body>

<div class="layout">

  <!-- ── CLOCK ── -->
  <div class="clock-panel">
    <div class="date-line" id="dateLine">—</div>
    <div class="time-display" id="timeDisplay">
      <span id="hh">00</span><span class="colon">:</span><span id="mm">00</span><span class="colon">:</span><span id="ss">00</span>
    </div>
    <div class="seconds-bar-wrap">
      <div class="seconds-bar" id="secondsBar" style="width:0%"></div>
    </div>
    <button class="format-toggle" id="fmtToggle" onclick="toggleFormat()">24H</button>
  </div>

  <!-- ── BOTTOM ROW ── -->
  <div class="bottom-row">

    <!-- Sensors -->
    <div class="panel sensor-panel">
      <div class="panel-title">Indoor Sensors</div>
      <div id="sensorContent">
        <div class="sensor-error">Waiting for sensors…</div>
      </div>
    </div>

    <!-- Weather -->
    <div class="panel weather-panel">
      <div class="panel-title">Weather Forecast</div>
      <div id="weatherContent">
        <div class="weather-offline">
          <span class="offline-icon">📡</span>
          Fetching forecast…
        </div>
      </div>
    </div>

  </div>

  <!-- ── STATUS BAR ── -->
  <div class="status-bar">
    <span class="status-item" id="sensorStatus"><span class="dot" id="sensorDot"></span>Sensors</span>
    <span class="status-item" id="centerStatus">PI CLOCK</span>
    <span class="status-item" id="weatherStatus"><span class="dot" id="weatherDot"></span>Weather</span>
  </div>

</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let use24h = localStorage.getItem('use24h') !== 'false'; // default true

// ── Clock ──────────────────────────────────────────────────────────────────
const DAYS  = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function pad(n) { return String(n).padStart(2, '0'); }

function updateClock() {
  const now = new Date();
  let h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();

  // Date
  document.getElementById('dateLine').textContent =
    `${DAYS[now.getDay()]}  ·  ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;

  // Time
  let hDisplay = h;
  if (!use24h) {
    hDisplay = h % 12 || 12;
  }
  document.getElementById('hh').textContent = pad(hDisplay);
  document.getElementById('mm').textContent = pad(m);
  document.getElementById('ss').textContent = pad(s);

  // Seconds bar
  document.getElementById('secondsBar').style.width = `${(s / 59) * 100}%`;
}

function toggleFormat() {
  use24h = !use24h;
  localStorage.setItem('use24h', use24h);
  const btn = document.getElementById('fmtToggle');
  btn.textContent = use24h ? '24H' : '12H';
  btn.classList.toggle('active', !use24h);
  updateClock();
}

// Set initial button state
(function() {
  const btn = document.getElementById('fmtToggle');
  btn.textContent = use24h ? '24H' : '12H';
  btn.classList.toggle('active', !use24h);
})();

setInterval(updateClock, 1000);
updateClock();


// ── Sensor polling ─────────────────────────────────────────────────────────
function updateSensors() {
  fetch('/api/sensors')
    .then(r => r.json())
    .then(d => {
      const dot = document.getElementById('sensorDot');
      const el  = document.getElementById('sensorContent');

      if (d.error && d.temperature === null) {
        dot.className = 'dot orange';
        el.innerHTML = `<div class="sensor-error">${d.error}</div>`;
        return;
      }

      dot.className = 'dot green';

      const tempVal = d.temperature !== null ? d.temperature : '–';
      const humVal  = d.humidity    !== null ? d.humidity    : '–';
      const presVal = d.pressure    !== null ? d.pressure    : '–';

      el.innerHTML = `
        <div class="sensor-grid">
          <div class="sensor-item">
            <div class="sensor-value">${tempVal}</div>
            <div class="sensor-unit">°C</div>
            <div class="sensor-label">Temp</div>
          </div>
          <div class="sensor-item">
            <div class="sensor-value">${humVal}</div>
            <div class="sensor-unit">%</div>
            <div class="sensor-label">Humidity</div>
          </div>
          <div class="sensor-item">
            <div class="sensor-value">${presVal}</div>
            <div class="sensor-unit">hPa</div>
            <div class="sensor-label">Pressure</div>
          </div>
        </div>
        ${d.light !== null ? `
        <div class="light-row">
          <div class="light-label">Light</div>
          <div class="light-bar-track">
            <div class="light-bar-fill" style="width:${Math.min(100, (d.light / 1000) * 100).toFixed(1)}%"></div>
          </div>
          <div class="light-lux">${d.light} lx</div>
        </div>` : ''}
      `;
    })
    .catch(() => {
      document.getElementById('sensorDot').className = 'dot orange';
    });
}

setInterval(updateSensors, 5000);
updateSensors();


// ── Weather polling ────────────────────────────────────────────────────────
const SHORT_DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function dayLabel(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const today = new Date();
  if (d.toDateString() === today.toDateString()) return 'Today';
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
  if (d.toDateString() === tomorrow.toDateString()) return 'Tmrw';
  return SHORT_DAYS[d.getDay()];
}

function updateWeather() {
  fetch('/api/weather')
    .then(r => r.json())
    .then(d => {
      const dot = document.getElementById('weatherDot');
      const el  = document.getElementById('weatherContent');

      if (d.error || !d.current) {
        dot.className = 'dot orange';
        el.innerHTML = `
          <div class="weather-offline">
            <span class="offline-icon">📡</span>
            ${d.error ? 'No internet connection.<br>Showing indoor data only.' : 'Fetching…'}
          </div>`;
        return;
      }

      dot.className = 'dot blue';
      const c = d.current;
      const fcHTML = d.forecast.slice(0,5).map(f => `
        <div class="forecast-day">
          <div class="fc-day-label">${dayLabel(f.date)}</div>
          <div class="fc-icon">${f.icon}</div>
          <div class="fc-temps">${f.max}°<br><span>${f.min}°</span></div>
        </div>`).join('');

      const updStr = d.last_updated
        ? new Date(d.last_updated).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
        : '';

      el.innerHTML = `
        <div class="weather-current">
          <div class="weather-icon">${c.icon}</div>
          <div>
            <div class="weather-temp">${c.temp}°C</div>
            <div class="weather-desc">${c.desc}</div>
            <div class="weather-wind">💨 ${c.windspeed} km/h · ${d.location}</div>
          </div>
          ${updStr ? `<div style="margin-left:auto;font-size:0.55rem;color:var(--dim);align-self:flex-start">↻ ${updStr}</div>` : ''}
        </div>
        <div class="forecast-strip">${fcHTML}</div>
      `;
    })
    .catch(() => {
      document.getElementById('weatherDot').className = 'dot orange';
    });
}

setInterval(updateWeather, 30000);
updateWeather();
</script>
</body>
</html>
